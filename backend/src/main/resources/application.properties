spring.datasource.url=${DB_URL:jdbc:h2:file:./data/voterowdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.sql.init.mode=never

# H2 console (dev only - disable in production via env)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

server.port=${PORT:8083}
server.address=0.0.0.0

# CORS - set VITE_API_BASE_URL on frontend and APP_CORS_ORIGINS on backend to match
app.cors.allowed-origins=${APP_CORS_ORIGINS:}

# JWT secret must be at least 32 characters (256-bit) for HS256
jwt.secret=${JWT_SECRET:voterow-dev-secret-key-change-in-production-min32chars}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
