spring.datasource.url=jdbc:mysql://localhost:3306/voterow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Suppress all logging except critical errors
logging.level.root=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.springframework=ERROR
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.security=ERROR
logging.level.com.voterow=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.apache=ERROR

# Disable banner and startup logs
spring.main.banner-mode=off
spring.jpa.open-in-view=false

server.port=8083
