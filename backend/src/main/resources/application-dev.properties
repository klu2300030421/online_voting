# Development profile using H2 database file so the app can run without MySQL
server.port=8081

# H2 file-based datasource (persists to disk so schema is available on next run)
spring.datasource.url=jdbc:h2:file:./data/voterowdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
## Disable automatic SQL data initialization in dev profile.
## We seed data programmatically via DataInitializer to avoid ordering/race issues
## between Hibernate schema creation and SQL scripts.
spring.sql.init.mode=never
#spring.sql.init.data-locations=classpath:data.sql

# H2 console for debugging (visit /h2-console when running with profile 'dev')
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Do not enable in production
app.debug=true