# Development profile - overrides application.properties
# Uses same file-based H2 as base config but with update (not create) to preserve data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

app.debug=true
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173
